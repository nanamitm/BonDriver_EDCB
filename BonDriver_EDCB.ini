[GLOBAL]
; EpgTimerSrv の HTTP サーバー(EpgTimerSrv.ini の HttpPort)
SERVER_HOST="localhost"
SERVER_PORT=5510

; 使用するエンドポイント
;   bonstream = 本プロジェクト付属の legacy/bonstream.lua を使う(推奨)
;               EIT が落ちないので TVTest で番組情報・EPG が使える
;   view      = EDCB 標準の legacy/view.lua を使う(サーバー側に何も追加しなくてよいが、
;               EIT が除去され、指定サービスのみに絞られる)
ENDPOINT=bonstream

; bonstream.lua 用の共有キー。EDCB/Setting/BonStream.ini の [BONSTREAM] Key= と同じ値を書く
; (英数字のみ推奨。未設定のままだと選局に失敗する)
STREAM_KEY=

; NetworkTV モードのID(0～99)。EDCB 側はこのIDごとに別のチューナーを割り当てる。
; TVTest を複数同時に使う場合は、DLL と ini をコピーしてそれぞれ別の値にする
NWTV_ID=0

; 指定サービスだけに絞り込むかどうか(1=絞り込む)。ENDPOINT=bonstream のときのみ有効。
; 0 のままだと EpgDataCap_Bon が出力しているストリームをそのまま受け取る。
; GROUP_BY_TS=1 のときは強制的に 0 として扱われる
SERVICE_FILTER=0

; ENDPOINT=view のときに使うトランスコード設定の番号。
; legacy/util.lua の XCODE_OPTIONS で "TS-Live!"(トランスコードなし)が何番目かを指定する。
; 標準の util.lua では 11 番目
VIEW_OPTION=11

; WebUI のパス。通常は変更不要
BASE_PATH="/legacy"

; チューナーを開く前にサーバーにHTTPヘッダを返させるかどうか(1=返させる/既定)。
; BS4Kのように EDCB 側の選局が30秒近くかかる環境でも、SetChannel() が視聴アプリの
; 待ち時間を超えないようにするための設定。かわりに選局に失敗しても SetChannel() は
; 成功扱いになり、「選局できたが映像が来ない」ように見える。
; 0 にすると選局の成否がそのまま SetChannel() の戻り値になる
EARLY_RESPONSE=1

; 1つの接続先アドレスに対する接続タイムアウト(ms)。
; ホスト名がIPv6とIPv4の両方に解決される環境で、待ち受けていない側にかかる時間の上限
CONNECT_TIMEOUT=1500

[CHANNEL]
; 同じトランスポートストリーム(ONID+TSID)のサービスを1チャンネルにまとめるかどうか
;   1 = まとめる(既定・推奨)。本来のBonDriverと同じ「1チャンネル=1物理チャンネル」になる。
;       TVTestのチャンネルスキャンは「サービスを検索する」をONにすること。
;       TVTest側でサービスを切り替えたい場合は EpgDataCap_Bon.ini の [SET] AllService=1 が必要。
;   0 = EDCBのChSet5と同じくサービスごとに1チャンネルにする。
;       ただしEDCBはSDTをサービス絞り込みの対象外にしているため、TVTestのスキャンで
;       同じTSのチャンネルがすべて先頭サービスとして扱われ、重複や名前欠落が起きる。
GROUP_BY_TS=1

; チューニング空間の分け方
;   0 = ONID から機械的に分類する(地デジ / BS / CS / BS4K / SKY)
;   1 = EDCB が持っているネットワーク名で分ける
SPACE_MODE=0

; チャンネル名(TVTestの「チャンネル」列)の付け方
;   1 = 番号にする(既定)。GROUP_BY_TS=1では1チャンネルに複数の放送が入るため、
;       代表サービス名より番号のほうが実態に合う。個々のサービス名はTVTestがSDTから拾う。
;       CS110は放送規格のND番号(ND2/ND4/…)、それ以外は空間ごとの連番(GR 01/BS 01/…)。
;   0 = そのTSの最初のサービス名にする
CHANNEL_NAME_MODE=1

; チャンネル名の先頭にリモコン番号を付けるかどうか(1=付ける)。CHANNEL_NAME_MODE=0のときのみ有効
SHOW_REMOTE_KEY=0

; 一覧に載せるサービス種別(service_type)をカンマ区切りで指定する。
;   1=デジタルTV, 161=臨時映像, 165=プロモーション映像, 173=超高精細4K特別映像
; 0 だけを指定するとすべてのサービスを載せる
SERVICE_TYPES=1,161,165,173

; ワンセグ(部分受信)サービスも一覧に載せるかどうか(1=載せる)
INCLUDE_PARTIAL=0
