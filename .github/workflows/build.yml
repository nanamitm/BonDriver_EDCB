name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# 同じブランチへの連続 push では古い実行を打ち切る
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # platform はソリューションの構成名、outdir はビルド出力先、
          # arch は vcvarsall.bat に渡す名前
          - platform: x64
            outdir: x64
            arch: x64
          - platform: x86
            outdir: Win32
            arch: x86

    steps:
      - uses: actions/checkout@v7

      - name: Locate Visual Studio
        shell: pwsh
        run: |
          # ツールセットはプロジェクト側で $(DefaultPlatformToolset) にしてあるので、
          # ランナーに入っている Visual Studio をそのまま使う
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -format json |
                ConvertFrom-Json | Select-Object -First 1
          if (-not $vs) { throw 'Visual Studio not found' }
          Write-Host "Visual Studio $($vs.installationVersion) : $($vs.installationPath)"
          "VSPATH=$($vs.installationPath)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build (${{ matrix.platform }})
        shell: cmd
        run: |
          call "%VSPATH%\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.arch }} || exit /b 1
          msbuild BonDriver_EDCB.sln /p:Configuration=Release /p:Platform=${{ matrix.platform }} /m /v:minimal || exit /b 1
          rem テスタもコンパイルが通ることを確認する(成果物には含めない)
          cl /nologo /EHsc /std:c++20 /utf-8 /Fe:${{ matrix.outdir }}\Release\bontest.exe /Fo:${{ matrix.outdir }}\Release\ test\bontest.cpp || exit /b 1

      - name: Collect files
        shell: cmd
        run: |
          mkdir dist\server || exit /b 1
          copy /y ${{ matrix.outdir }}\Release\BonDriver_EDCB.dll dist\ || exit /b 1
          copy /y BonDriver_EDCB.ini dist\ || exit /b 1
          copy /y server\bonstream.lua dist\server\ || exit /b 1
          copy /y README.md dist\ || exit /b 1
          copy /y INTERNALS.md dist\ || exit /b 1
          copy /y LICENSE dist\ || exit /b 1

      - uses: actions/upload-artifact@v7
        with:
          name: BonDriver_EDCB-${{ matrix.platform }}
          path: dist
          if-no-files-found: error
